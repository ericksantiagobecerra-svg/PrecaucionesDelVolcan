<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Prevención Puracé — Kunchikuya</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f100d;--tar:rgba(28,30,25,.75);--bor:rgba(255,255,255,.12);--pri:#FF5722;--glow:rgba(255,87,34,.45);--ok:#2E7D32;--okbg:rgba(46,125,50,.25);--mal:#C62828;--malbg:rgba(198,40,40,.25);--ale:#FFB300;--txt:#F5F2EB;--dim:#B3ADA0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg) radial-gradient(circle at top center,#26120b 0%,#0f100d 75%);font-family:'Poppins',sans-serif;color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#canvas-ceniza{z-index:0;opacity:.55}#canvas-magma{z-index:1}#canvas-confeti{z-index:100}
.juego{width:100%;max-width:620px;position:relative;z-index:10}
.cabecera{text-align:center;margin-bottom:20px;position:relative}
.btn-sonido{position:absolute;top:0;right:0;background:rgba(255,255,255,.1);border:1px solid var(--bor);color:var(--txt);border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:1.2rem}
.volcan-container{width:150px;height:150px;margin:0 auto 12px;filter:drop-shadow(0 12px 20px rgba(255,87,34,.3))}
.volcan-container.sacudir{animation:sacudir .5s ease infinite}
@keyframes sacudir{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-3deg) scale(1.05)}75%{transform:translateY(8px) rotate(3deg) scale(1.05)}}
.volcan-svg{width:100%;height:100%;overflow:visible}
.humo{animation:humo 3s ease-in-out infinite;transform-origin:center bottom;opacity:0}
.humo2{animation-delay:1s}.humo3{animation-delay:2s}
@keyframes humo{0%{transform:translateY(10px) scale(.4);opacity:0}30%{opacity:.7}100%{transform:translateY(-45px) scale(1.6);opacity:0}}
.lava-crater{animation:lava 2s alternate infinite}
@keyframes lava{0%{fill:#d84315}100%{fill:#ff7043}}
.volcan-container.erupcion .lava-crater{fill:#ffea00!important;filter:drop-shadow(0 0 25px #ffea00)}
h1{font-size:1.6rem;font-weight:800;line-height:1.25;margin:0 0 6px}
.subtitulo{color:var(--pri);font-size:.9rem;font-weight:600;margin:0;letter-spacing:1.2px}
.tarjeta{background:var(--tar);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bor);border-radius:20px;padding:32px;box-shadow:0 25px 60px rgba(0,0,0,.6)}
.tarjeta.temblor{animation:temblor .4s ease}
@keyframes temblor{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
